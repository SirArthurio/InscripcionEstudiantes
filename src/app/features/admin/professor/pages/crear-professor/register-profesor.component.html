<app-card-formulario-validacion
  [validacionData]="validacionData()"
  [data]="datos()"
  [progress]="progress()"
  [isEditar]="isEditar()"
  (nuevaAccion)="nuevoProfessor()"
>
  <form
    #formulario
    class="relative formulario-profesor"
    [formGroup]="formRegister"
  >
    <!-- Sección: Datos Personales -->
    <div class="seccion-formulario">
      <h2 class="seccion-titulo">
        <i class="pi pi-user"></i>
        Datos Personales
      </h2>

      <div class="campos-grid">
        <div class="campo-wrapper">
          <label for="firstName" class="campo-label">Nombre</label>
          <input
            pInputText
            id="firstName"
            type="text"
            placeholder="Nombre"
            class="campo-input"
            formControlName="firstName"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper">
          <label for="lastName" class="campo-label">Apellido</label>
          <input
            pInputText
            id="lastName"
            type="text"
            placeholder="Apellido"
            class="campo-input"
            formControlName="lastName"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper">
          <label for="birthDate" class="campo-label">Fecha de Nacimiento</label>
          <input
            pInputText
            id="birthDate"
            type="date"
            [min]="edadadService.VerificacionMenor80Edad()"
            [max]="edadadService.VerificacionMayor18Edad()"
            class="campo-input"
            formControlName="birthDate"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper">
          <label for="gender" class="campo-label">Género</label>
          <p-select
            [options]="generos"
            optionValue="code"
            optionLabel="genre"
            placeholder="Selecciona un género"
            id="gender"
            class="campo-input"
            formControlName="gender"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper">
          <label for="documentType" class="campo-label"
            >Tipo de Documento</label
          >
          <p-select
            formControlName="documentType"
            [options]="documentsTypes()"
            optionValue="code"
            optionLabel="documentType"
            placeholder="Selecciona un tipo"
            class="campo-input"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper">
          <label for="documentNumber" class="campo-label"
            >Número de Documento</label
          >
          <input
            pInputText
            id="documentNumber"
            type="text"
            SoloNumeros
            placeholder="Número de documento"
            class="campo-input"
            formControlName="documentNumber"
            appValidationClass
            [minlength]="6"
            [maxlength]="10"
          />
        </div>
      </div>
    </div>

    <!-- Sección: Datos de Contacto -->
    <div class="seccion-formulario">
      <h2 class="seccion-titulo">
        <i class="pi pi-phone"></i>
        Datos de Contacto
      </h2>

      <div class="campos-grid">
        <div class="campo-wrapper">
          <label for="phone" class="campo-label">Número de Celular</label>
          <input
            pInputText
            SoloNumeros
            id="phone"
            type="text"
            placeholder="Teléfono"
            formControlName="phone"
            [minlength]="10"
            [maxlength]="10"
            class="campo-input"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper">
          <label for="birthPlace" class="campo-label"
            >Lugar de Nacimiento</label
          >
          <input
            pInputText
            id="birthPlace"
            type="text"
            placeholder="Lugar de Nacimiento"
            formControlName="birthPlace"
            class="campo-input"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper">
          <label for="placeOfResidence" class="campo-label"
            >Lugar de Residencia</label
          >
          <input
            pInputText
            id="placeOfResidence"
            type="text"
            placeholder="Ej: Calle 20# 21-29"
            formControlName="placeOfResidence"
            class="campo-input"
            appValidationClass
          />
        </div>
      </div>
    </div>

    <!-- Sección: Datos Académicos -->
    <div class="seccion-formulario">
      <h2 class="seccion-titulo">
        <i class="pi pi-graduation-cap"></i>
        Datos Académicos
      </h2>

      <div class="campos-grid">
        <div class="campo-wrapper">
          <label for="specialty" class="campo-label">Especialidad</label>
          <input
            pInputText
            id="specialty"
            type="text"
            placeholder="Especialidad"
            class="campo-input"
            formControlName="specialty"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper" formGroupName="user">
          <label for="institutionalEmail" class="campo-label"
            >Email Institucional</label
          >
          <input
            pInputText
            id="institutionalEmail"
            type="email"
            placeholder="Email Institucional"
            class="campo-input"
            formControlName="institutionalEmail"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper" formGroupName="user">
          <label for="password" class="campo-label">Contraseña</label>
          <p-password
            id="password"
            formControlName="password"
            placeholder="Contraseña"
            [toggleMask]="true"
            styleClass="campo-input"
            [fluid]="true"
            [feedback]="false"
            appValidationClass
          />
        </div>
      </div>
    </div>

    <!-- Sección de Acciones -->
    @if (progress()===0) {
    <div class="acciones-section">
      <p-button
        class="accion-btn accion-principal"
        (onClick)="tipoDeAccion()"
        [label]="datos().buttonText"
        icon="pi pi-save"
        severity="primary"
      />
    </div>
    } @else if(progress()===1){
    <!-- Contenido para siguiente paso -->
    }

    <p-confirmdialog />

    <!-- Efecto de luz animado -->
    <app-carta
      [duration]="6"
      [delay]="2"
      [borderWidth]="2"
      borderRadius="xl"
      [reverse]="true"
    />
  </form>
</app-card-formulario-validacion>
