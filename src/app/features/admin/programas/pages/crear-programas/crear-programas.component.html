<app-card-formulario-validacion
  [validacionData]="validacionData()"
  [data]="datos()"
  [progress]="progress()"
  [isEditar]="isEditar()"
  (nuevaAccion)="nuevoPrograma()"
>
  <p-confirmdialog />

  <form
    #formulario
    class="relative formulario-programa"
    [formGroup]="formProgramas"
  >
    <!-- Grid de campos -->
    <div class="campos-grid">
      <div class="campo-wrapper">
        <label for="code" class="campo-label">Código</label>
        <input
          pInputText
          id="code"
          type="text"
          placeholder="Código del programa"
          class="campo-input"
          formControlName="code"
          appValidationClass
        />
      </div>

      <div class="campo-wrapper">
        <label for="name" class="campo-label">Nombre</label>
        <input
          pInputText
          id="name"
          type="text"
          placeholder="Nombre del programa"
          class="campo-input"
          formControlName="name"
          appValidationClass
        />
      </div>

      <div class="campo-wrapper campo-full">
        <label for="description" class="campo-label">Descripción</label>
        <textarea
          pInputTextarea
          id="description"
          placeholder="Descripción del programa"
          class="campo-input"
          formControlName="description"
          appValidationClass
          rows="4"
        ></textarea>
      </div>
    </div>

    <!-- Sección de acciones -->
    @if (progress()===0) {
    <div class="acciones-section">
      <p-button
        class="accion-btn accion-principal"
        (onClick)="tipoDeAccion()"
        [label]="datos().buttonText"
        icon="pi pi-save"
        severity="primary"
      />
    </div>
    } @else if(progress()===1){
    <!-- Contenido para siguiente paso -->
    }

    <!-- Efecto de luz animado -->
    <app-carta
      [duration]="6"
      [delay]="2"
      [borderWidth]="2"
      borderRadius="xl"
      [reverse]="true"
    />
  </form>
</app-card-formulario-validacion>
