<app-card-formulario-validacion
  [validacionData]="validacionData()"
  [data]="datos()"
  [progress]="progress()"
  [isEditar]="isEditar()"
  [continuarProceso]="true"
  (nuevaAccion)="nuevaConvocatoria()"
  (continuar)="continuarProgreso()"
>
  <p-confirmdialog />

  <form
    #formulario
    class="relative grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 justify-items-center border-transparent rounded-xl p-2"
    [formGroup]="formConvocatoria"
  >
    <div class="contenedor">
      <label
        for="code"
        class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2"
        >Codigo</label
      >
      <input
        pInputText
        id="code"
        type="text"
        placeholder="Codigo"
        class="w-full md:w-[30rem] mb-8"
        formControlName="code"
        appValidationClass
      />
    </div>
    <div class="contenedor">
      <label
        for="name"
        class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2"
        >Nombre</label
      >
      <input
        pInputText
        id="name"
        type="text"
        placeholder="Nombre"
        class="w-full md:w-[30rem] mb-8"
        formControlName="name"
        appValidationClass
      />
    </div>
    <div class="contenedor">
      <label
        for="description"
        class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2"
        >Descripcion</label
      >
      <input
        pInputText
        id="description"
        type="text"
        placeholder="description"
        class="w-full md:w-[30rem] mb-8"
        formControlName="description"
        appValidationClass
      />
    </div>

    <div class="contenedor">
      <label
        for="range"
        class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2"
        >Fecha Clases
      </label>
      <p-datepicker
        id="range"
        formControlName="rangeDatesClass"
        selectionMode="range"
        [readonlyInput]="true"
        [showButtonBar]="true"
        [minDate]="minDate"
        placeholder="Selecciona un rango"
        [showIcon]="true"
        class="w-full md:w-[30rem] mb-8"
        appValidationClass
      ></p-datepicker>
    </div>
    <div class="contenedor">
      <label
        for="range"
        class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2"
        >Fecha Convocatoria
      </label>
      <p-datepicker
        id="range"
        formControlName="rangeDatesEnrollment"
        selectionMode="range"
        [readonlyInput]="true"
        [showButtonBar]="true"
        [minDate]="minDate"
        placeholder="Selecciona un rango"
        [showIcon]="true"
        class="w-full md:w-[30rem] mb-8"
        appValidationClass
      ></p-datepicker>
    </div>

    <div class="contenedor grid grid-cols-2 justify-items-center">
      <label
        class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2 col-span-2"
        >Acciones
      </label>
      @if (progress()===0) {
      <!--  -->
      @if (isEditar()) {
      <p-button
        class="w-full mb-4 p-2"
        (click)="crearGrupo()"
        label="Crear Grupo"
        [outlined]="true"
      />
      <p-button
        class="w-full mb-4 p-2"
        (click)="verGrupos()"
        label="Ver Grupos"
        [outlined]="true"
      />
      }
      <!--  -->
      <p-button
        class="w-full mb-4 p-2"
        (click)="tipoDeAccion()"
        [label]="datos().buttonText"
        [outlined]="true"
      />

      <!--  -->
      }@else if(progress()===1){ }
    </div>

    <app-carta
      [duration]="6"
      [delay]="2"
      [borderWidth]="2"
      borderRadius="xl"
      [reverse]="true"
    >
    </app-carta>
  </form>
</app-card-formulario-validacion>
