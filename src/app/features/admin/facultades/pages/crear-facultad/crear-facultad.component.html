<app-card-formulario-validacion
  [validacionData]="validacionData()"
  [data]="datos()"
  [progress]="progress()"
  [isEditar]="isEditar()"
  (nuevaAccion)="nuevaConvocatoria()"
>
  <p-confirmdialog />

  <form
    #formulario
    class="relative formulario-facultad"
    [formGroup]="formFacultad"
  >
    <!-- Sección: Información Básica -->
    <div class="seccion-formulario">
      <h2 class="seccion-titulo">
        <i class="pi pi-building"></i>
        Información Básica
      </h2>

      <div class="campos-grid">
        <div class="campo-wrapper">
          <label for="code" class="campo-label">Código</label>
          <input
            pInputText
            id="code"
            type="text"
            placeholder="Código de la facultad"
            class="campo-input"
            formControlName="code"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper">
          <label for="name" class="campo-label">Nombre</label>
          <input
            pInputText
            id="name"
            type="text"
            placeholder="Nombre de la facultad"
            class="campo-input"
            formControlName="name"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper campo-full">
          <label for="description" class="campo-label">Descripción</label>
          <textarea
            pInputTextarea
            id="description"
            placeholder="Descripción de la facultad"
            class="campo-input"
            formControlName="description"
            appValidationClass
            rows="3"
          ></textarea>
        </div>
      </div>
    </div>

    <!-- Sección: Datos de Contacto -->
    <div class="seccion-formulario">
      <h2 class="seccion-titulo">
        <i class="pi pi-phone"></i>
        Datos de Contacto
      </h2>

      <div class="campos-grid">
        <div class="campo-wrapper">
          <label for="phoneNumber" class="campo-label">Número de Celular</label>
          <input
            pInputText
            SoloNumeros
            id="phoneNumber"
            type="text"
            placeholder="Teléfono"
            formControlName="phoneNumber"
            [minlength]="10"
            [maxlength]="10"
            class="campo-input"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper">
          <label for="email" class="campo-label">Email Institucional</label>
          <input
            pInputText
            id="email"
            type="email"
            placeholder="Email Institucional"
            class="campo-input"
            formControlName="email"
            appValidationClass
          />
        </div>

        <div class="campo-wrapper campo-full">
          <label for="address" class="campo-label">Dirección</label>
          <input
            pInputText
            id="address"
            type="text"
            placeholder="Dirección de la facultad"
            class="campo-input"
            formControlName="address"
            appValidationClass
          />
        </div>
      </div>
    </div>

    <!-- Sección: Extensiones -->
    <div class="seccion-formulario" formArrayName="extensions">
      <h2 class="seccion-titulo">
        <i class="pi pi-hashtag"></i>
        Extensiones Telefónicas
      </h2>

      <div class="extension-nueva">
        <div class="campo-wrapper flex-1">
          <label for="new-extension" class="campo-label">Nueva Extensión</label>
          <input
            pInputText
            id="new-extension"
            placeholder="Número de extensión"
            type="text"
            class="campo-input"
            [formControl]="newExtension"
            appValidationClass
          />
        </div>
        <p-button
          class="agregar-extension-btn"
          (onClick)="agregarExtension()"
          label="Agregar"
          icon="pi pi-plus"
          [outlined]="true"
          severity="primary"
        />
      </div>

      @if (extension.controls.length > 0) {
      <div class="extensiones-lista">
        @for (item of extension.controls; track item; let i = $index) {
        <div class="extension-item">
          <input
            pInputText
            type="text"
            class="campo-input flex-1"
            [formControlName]="i"
            appValidationClass
            placeholder="Extensión"
          />
          <p-button
            class="eliminar-extension-btn"
            (onClick)="eliminarExtension(i)"
            icon="pi pi-trash"
            severity="danger"
            [outlined]="true"
            [text]="true"
          />
        </div>
        }
      </div>
      }
    </div>

    <!-- Sección de Acciones -->
    <div class="acciones-section">
      @if (isEditar()) {
      <p-button
        class="accion-btn"
        (onClick)="crearPrograma()"
        label="Crear Programa"
        icon="pi pi-plus"
        [outlined]="true"
        severity="secondary"
      />
      } @if (progress()===0) {
      <p-button
        class="accion-btn accion-principal"
        (onClick)="tipoDeAccion()"
        [label]="datos().buttonText"
        icon="pi pi-save"
        severity="primary"
      />
      } @else if(progress()===1) {
      <!-- Contenido para siguiente paso -->
      }
    </div>

    <!-- Efecto de luz animado -->
    <app-carta
      [duration]="6"
      [delay]="2"
      [borderWidth]="2"
      borderRadius="xl"
      [reverse]="true"
    />
  </form>
</app-card-formulario-validacion>
