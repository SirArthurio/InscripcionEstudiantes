<div
  class="min-h-screen p-8 bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800"
>
  <p-toast />
  <p-confirmdialog />

  <!-- Hero Header -->
  <div class="animate-fade-in-up page-header mb-12">
    <div class="page-header-content">
      <!-- Botón de volver a la izquierda -->
      <p-button
        class="volver-btn"
        icon="pi pi-arrow-left"
        label="Volver"
        [outlined]="true"
        severity="secondary"
        (onClick)="volver()"
      />

      <!-- Título y botón de crear -->
      <div class="header-center">
        <h1
          class="flex items-center justify-center gap-4 text-4xl font-bold mb-4"
          style="color: var(--text-color)"
        >
          <i
            class="pi pi-graduation-cap text-4xl"
            style="color: var(--primary-color)"
          ></i>
          Competencias y Cursos
        </h1>

        <p-button
          icon="pi pi-plus"
          label="Nueva Convocatoria"
          severity="primary"
          (onClick)="crear()"
        />
      </div>
    </div>
  </div>

  <!-- Main Content Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
    <!-- Sección de Cursos -->
    <section
      class="animate-fade-in-up animation-delay-100 card-hover rounded-2xl p-8 shadow-lg"
    >
      <div class="flex items-center gap-3 mb-6 pb-4 section-header-border">
        <div class="section-icon-wrapper">
          <i class="pi pi-book text-2xl"></i>
        </div>
        <h2 class="text-2xl font-semibold" style="color: var(--text-color)">
          Explorar Cursos
        </h2>
      </div>
      <app-escoger-curso
        (onAgregarCursoAGrupo)="respuestaCursoAGrupo($event)"
      />
    </section>

    <!-- Sección de Grupos -->
    <section
      class="animate-fade-in-up animation-delay-200 card-hover rounded-2xl p-8 shadow-lg"
    >
      <div class="flex items-center gap-3 mb-6 pb-4 section-header-border">
        <div class="section-icon-wrapper">
          <i class="pi pi-users text-2xl"></i>
        </div>
        <h2 class="text-2xl font-semibold" style="color: var(--text-color)">
          Grupos Creados
        </h2>
      </div>
      <grupos-creados />
    </section>
  </div>

  <p-dialog
    [modal]="true"
    [(visible)]="this.visibleGrupo"
    (onHide)="this.cerrarCrearGrupo()"
    maskStyleClass="backdrop-blur-sm"
    [style]="{ width: '90vw', maxWidth: '600px' }"
    [draggable]="false"
    [resizable]="false"
  >
    <ng-template pTemplate="header">
      <div class="flex items-center gap-2">
        <i class="pi pi-plus-circle" style="color: var(--primary-color)"></i>
        <span class="font-semibold">Crear Nuevo Grupo</span>
      </div>
    </ng-template>
    <grupo-modal-crear-grupo
      (cerrarModal)="this.cerrarCrearGrupo()"
      (abrirModal)="showCrearGrupo()"
    />
  </p-dialog>
</div>
