<app-card-formulario [datos]="datos">
  <p-dialog />
  <p-toast />

  <div>
    <!-- Aquí agregamos el ngSubmit -->
    <form [formGroup]="formLogin" (ngSubmit)="enviarFormulario()">
      <label
        for="username"
        class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2"
        >Usuario</label
      >
      <p-inputGroup class="w-full md:w-[30rem] mb-8">
        <input
          pInputText
          appValidationClass
          id="username"
          type="text"
          placeholder="Usuario"
          formControlName="username"
        />
        <p-inputGroupAddon>&#64;unicesar.edu.co</p-inputGroupAddon>
      </p-inputGroup>
      

      <label
        for="password1"
        class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2"
        >Password</label
      >
      <p-password
        id="password1"
        formControlName="password"
        placeholder="Password"
        [toggleMask]="true"
        styleClass="mb-4"
        [fluid]="true"
        [feedback]="false"
        appValidationClass
      ></p-password>

      <!-- El botón debe ser submit -->
      <p-button
        type="submit"
        label="Sign In"
        styleClass="w-full"
      ></p-button>
    </form>

    <div class="flex items-center justify-between mt-2 mb-8 gap-8">
      <span
        routerLink="/auth/forgot-password"
        class="font-medium no-underline ml-2 text-right cursor-pointer text-primary"
        >Olvidaste la contraseña?</span
      >
      <span
        routerLink="/auth/register"
        class="font-medium no-underline ml-2 text-right cursor-pointer text-primary"
        >No tienes cuenta?, registrate!</span
      >
    </div>
  </div>

  <app-send-institucional-email
    (cerrar)="this.visible.set(false)"
    [show]="this.visible()"
    [emailReceive]="this.email()"
  />
</app-card-formulario>
