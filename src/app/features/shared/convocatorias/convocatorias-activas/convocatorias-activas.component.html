<div class="card shadow-md rounded-2xl">
  <header class="flex flex-row items-center">
    <i
      class="pi pi-calendar"
      style="font-size: 2rem; color: var(--primary-color)"
    ></i>
    <div class="ml-2 text-2xl font-bold">{{ texto.title }}</div>
  </header>
  <hr />

  @if (filtradas().length > 0) {
    @for (item of filtradas(); track $index) {
      <div
        class="rounded-lg m-2 p-4 transition cursor-pointer border-2 hover:shadow-lg"
        [ngClass]="{
          'border-primary bg-primary-50 dark:bg-primary-950': selectedId() === item.id,
          'border-surface-200 dark:border-surface-700': selectedId() !== item.id
        }"
        (click)="seleccionarConvocatoria(item)"
      >
        <div class="flex justify-between items-center">
          <div class="text-xl font-semibold">{{ item.name }}</div>
          <p-tag [severity]="statusColor(item.status)">
            {{ item.status }}
          </p-tag>
        </div>

        <div class="text-sm font-light mt-1">
          {{ item.enrollmentStartDate }} - {{ item.enrollmentEndDate }}
        </div>

        <div class="text-sm mt-2">
          {{ item.description }}
        </div>
      </div>
    }
  } @else {
    <app-no-data />
  }
</div>
