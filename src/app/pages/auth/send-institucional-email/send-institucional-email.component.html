<div class="card flex justify-center">
  <p-dialog
    [header]="`${texto.title}`"
    [modal]="true"
    [(visible)]="visible"
    [style]="{ width: '25rem' }"
  >
    <h4>{{ texto.content }}</h4>
    <div class="flex justify-end gap-2">
      <p-button label="Salir" severity="secondary" (click)="visible = false" />
      <p-button label="Enviar" (click)="this.confirmado()" />
    </div>
  </p-dialog>
</div>
